name: Tests

on:
  pull_request:
    branches: [ stable ]
  push:
    branches: [ stable ]

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with uv
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --group dev --python ${{ matrix.python-version }} pytest -q -p no:cov

  coverage:
    name: Python 3.11 coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with uv
        run: uv sync --locked --dev --python 3.11

      - name: Run tests with coverage
        run: make check-coverage

  otel-compatibility:
    name: Kedi OTel / Pydantic AI ${{ matrix.pydantic-ai }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic-ai: ["1.95.1", "latest-v2"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --locked --dev --python 3.11

      - name: Select minimum Pydantic AI
        if: matrix.pydantic-ai == '1.95.1'
        run: uv pip install --python .venv/bin/python "pydantic-ai==1.95.1"

      - name: Select latest Pydantic AI 2.x
        if: matrix.pydantic-ai == 'latest-v2'
        run: uv pip install --python .venv/bin/python "pydantic-ai>=2,<3"

      - name: Run standalone Kedi OTel tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: kedi-otel/src
        run: .venv/bin/python -m pytest -q kedi-otel/tests
