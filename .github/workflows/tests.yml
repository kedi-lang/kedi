name: Tests

on:
  pull_request:
    branches: [ stable ]
  push:
    branches: [ stable ]

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with uv
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --group dev --python ${{ matrix.python-version }} pytest -q -p no:cov

      - name: Validate installed release wheels outside the checkout
        run: python scripts/check_distribution.py --python ${{ matrix.python-version }}

  coverage:
    # Python 3.11 misattributes exit arcs after async context managers.
    # Keep compatibility testing there, but measure branches on Python 3.12.
    name: Python 3.12 coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies with uv
        run: uv sync --locked --dev --python 3.12

      - name: Run tests with coverage
        run: make check-coverage

      - name: Verify bundled Kedi skill examples
        run: uv run --locked --group dev --python 3.12 python .agents/skills/kedi/scripts/verify_examples.py

  notebook:
    name: Python 3.11 notebook integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Kedi with notebook support
        run: uv sync --locked --dev --extra notebook --python 3.11

      - name: Run notebook tests
        run: uv run --group dev --extra notebook --python 3.11 pytest notebook/tests -q -p no:cov

      - name: Verify notebook CLI
        run: uv run --extra notebook --python 3.11 kedi notebook --help

      - name: Build notebook distribution
        run: uv build notebook

      - name: Verify notebook wheel assets
        run: >-
          uv run --extra notebook --python 3.11 python -c
          "import glob, zipfile;
          wheel = glob.glob('notebook/dist/*.whl')[0];
          names = set(zipfile.ZipFile(wheel).namelist());
          assert 'kedi_notebook/static/notebook/index.html' in names;
          assert 'kedi_notebook/static/pyodide-worker.js' in names;
          assert 'kedi_notebook/static/vendor/pyodide/pyodide.mjs' in names;
          assert 'kedi_notebook/static/vendor/pyodide/pyodide.asm.wasm' in names;
          assert 'kedi_notebook/static/vendor/pyodide/python_stdlib.zip' in names;
          assert 'kedi_notebook/static/vendor/pyodide/pydantic-2.12.5-py3-none-any.whl' in names;
          assert 'kedi_notebook/static/grammars/kedi/tree-sitter-kedi.wasm' in names"

  terminal-bench:
    name: Python 3.12 Harbor integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Kedi with Harbor support
        run: uv sync --locked --no-dev --extra terminal-bench --python 3.12

      - name: Run Harbor integration tests
        run: >-
          uv run --no-dev --extra terminal-bench --with pytest==9.0.3 --python 3.12
          --with 'cassetter[httpx]==0.5.0'
          pytest tests/test_harbor_integration.py -q -p no:cov

      - name: Verify Terminal-Bench CLI
        run: >-
          uv run --no-dev --extra terminal-bench --python 3.12
          kedi-terminal-bench --help

      - name: Build Kedi wheel
        run: uv build --wheel

      - name: Verify Harbor wheel assets
        run: >-
          uv run --no-dev --extra terminal-bench --python 3.12 python -c
          "import glob, zipfile;
          wheel = glob.glob('dist/kedi-*.whl')[0];
          names = set(zipfile.ZipFile(wheel).namelist());
          required = {
          'kedi/integrations/harbor/benchmark_agent.kedi',
          'kedi/integrations/harbor/agent.py',
          'kedi/integrations/harbor/host.py',
          'kedi/integrations/harbor/runner.py',
          'kedi/integrations/harbor/terminal/__init__.py',
          'kedi/integrations/harbor/terminal/session.py',
          'kedi/integrations/harbor/terminal/processes.py',
          'kedi/integrations/harbor/terminal/output.py',
          'kedi/integrations/harbor/terminal/audit.py'};
          assert required <= names, sorted(required - names)"
