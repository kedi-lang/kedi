name: Code Formatter

on:
  push:
    branches: [ stable ]

jobs:
  auto-format:
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies with uv
        run: uv sync --dev

      - name: Run Ruff formatter (safe mode)
        run: |
          set +e
          uv run --group dev ruff format . || true
          uv run --group dev ruff check . --fix --select I || true
          set -e

      - name: Commit formatted code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout stable

          git add .
          git diff --cached --quiet || git commit -m "format: ruff"

          git push origin stable
