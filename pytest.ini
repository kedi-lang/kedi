[pytest]
minversion = 8.0
addopts = -ra -q
testpaths = tests

markers =
    llm: marks tests that hit real LLMs (requires OPENAI_API_KEY)

filterwarnings =
    ignore:There is no current event loop:DeprecationWarning:pydantic_graph._utils
    ignore:The 'prefix' argument in InputField/OutputField is deprecated and has no effect in DSPy.*:DeprecationWarning
    ignore:cache could not write path .*:pytest.PytestCacheWarning
