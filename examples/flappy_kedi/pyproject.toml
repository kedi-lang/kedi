[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kedi-flappy-example"
version = "0.1.0"
description = "Local display and physics support for the Flappy Kedi example"
requires-python = ">=3.10"
dependencies = ["pygame==2.6.1", "pymunk==7.3.0", "kedi-decisions>=0.1,<0.2"]

[project.optional-dependencies]
jev = ["kedi-typesafe>=0.2.1,<0.4"]

[tool.setuptools]
packages = ["flappy_kedi"]

[tool.setuptools.package-data]
flappy_kedi = ["assets/*"]
