[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kedi"
dynamic = ["version"]
description = "Kedi Language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.3,<9",
    "questionary>=2.1.1,<3",
    "pydantic>=2.13.4,<2.14",
    "packaging>=25,<26",
    "docstring-parser>=0.18,<0.19",
    "python-dotenv>=1.2.2,<2",
    "pydantic-settings>=2.14.1,<2.15",
    "prompt-toolkit>=3.0.52,<3.1",
    "pydantic-ai-slim>=2.36.0,<=2.45.0",
    "pydantic-monty==0.0.21",
    "jsonschema>=4.26,<5",
    "tree-sitter==0.25.2",
    "tree-sitter-kedi==0.4.1",
    "tree-sitter-python==0.25.0",
    "pygls==2.1.1",
    "rich>=15,<16",
]
authors = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
maintainers = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
license = {text = "Apache-2.0"}
keywords = ["kedi", "llm", "orchestration", "dsl", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://docs.kedi-lang.org/"
Source = "https://github.com/kedi-lang/kedi"
Tracker = "https://github.com/kedi-lang/kedi/issues"

[project.scripts]
kedi = "kedi.__main__:main"
kedi-lsp = "kedi.lsp.server:main"
kedi-terminal-bench = "kedi.integrations.harbor.host:main"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk==0.2.148",
]
codex-model = [
    "codex-auth-helper[websocket]==1.8.0; python_version >= '3.11'",
]
dspy = [
    "dspy==3.3.1",
]
groq = [
    "groq==1.7.0",
]
langchain = [
    "langchain==1.3.18",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.0",
    "langchain-openrouter==0.2.8",
]
langchain-aws = [
    "langchain==1.3.18",
    "langchain-aws==1.7.4",
]
notebook = [
    "kedi-notebook>=0.1,<0.2",
]
playground = [
    "basedpyright>=1.39.6,<1.40",
    "fastapi>=0.138.1,<0.139",
    "uvicorn>=0.47,<0.48",
]
terminal-bench = [
    "codex-auth-helper==1.8.0; python_version >= '3.12'",
    "harbor[daytona]==0.22.0; python_version >= '3.12'",
]
typesafe = [
    "kedi-typesafe==0.2.1",
]
a2a = [
    "a2a-sdk[http-server]==1.1.4",
    "uvicorn==0.47.0",
]

[tool.hatch.build]
include-package-data = true

[tool.hatch.version]
path = "src/kedi/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kedi",
    "/src/kedi/modules/*.kedi",
    "/README.md",
    "/LICENSE",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/kedi",
]

[tool.uv]
conflicts = [
    [
        { extra = "terminal-bench" },
        { group = "dev" },
    ],
    [
        { extra = "terminal-bench" },
        { extra = "codex-model" },
    ],
    [
        { extra = "codex-model" },
        { group = "dev" },
    ],
    [
        { extra = "codex-model" },
        { extra = "typesafe" },
    ],
    [
        { extra = "terminal-bench" },
        { extra = "typesafe" },
    ],
]

[tool.uv.sources]
tree-sitter-kedi = { path = "tree-sitter-kedi", editable = true }
kedi-notebook = { path = "notebook", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
extra-paths = ["notebook/src"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["src/kedi"]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]

[tool.coverage.report]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\s*\\.\\.\\.\\s*(#.*)?$",
]

[dependency-groups]
dev = [
    "a2a-sdk[http-server]==1.1.4",
    "anthropic==1.6.0",
    "basedpyright==1.39.6",
    "cassetter[httpx]==0.5.0",
    "coverage==7.14.1",
    "dspy==3.3.1",
    "groq==1.7.0",
    "langchain==1.3.18",
    "langchain-aws==1.7.4",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.0",
    "langchain-openrouter==0.2.8",
    "kedi-typesafe[all]==0.2.1",
    "pre-commit==4.6.0",
    "pydantic-ai==2.45.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.16",
    "tomli==2.4.1; python_version < '3.11'",
    "ty==0.0.44",
    "uvicorn==0.47.0",
]
