[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "kedi"
dynamic = ["version"]
description = "Kedi Language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0,<9",
    "questionary>=2.1.1,<3",
    "pydantic>=2.14.3,<2.15",
    "packaging>=26.3,<27",
    "docstring-parser>=0.18,<0.19",
    "python-dotenv>=1.2.4,<2",
    "pydantic-settings>=2.16.2,<2.17",
    "prompt-toolkit>=3.0.53,<3.1",
    "pydantic-ai-slim>=2.66.0,<2.67",
    "pydantic-monty==1.4.0",
    "jsonschema>=4.26,<5",
    "tree-sitter==0.26.0",
    "tree-sitter-kedi==0.4.5",
    "tree-sitter-python==0.25.0",
    "pygls==2.1.1",
    "rich>=15,<16",
]
authors = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
# PyPI shows only the first author and the first maintainer, so the two lists differ in order.
maintainers = [
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"},
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
]
license = {text = "Apache-2.0"}
keywords = ["kedi", "llm", "orchestration", "dsl", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://docs.kedi-lang.org/"
Source = "https://github.com/kedi-lang/kedi"
Tracker = "https://github.com/kedi-lang/kedi/issues"

[project.scripts]
kedi = "kedi.__main__:main"
kedi-lsp = "kedi.lsp.server:main"
kedi-terminal-bench = "kedi.integrations.harbor.host:main"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk==0.2.178",
]
codex-model = [
    "codex-auth-helper[websocket]==1.13.0",
]
dspy = [
    "dspy==3.4.1",
]
groq = [
    "groq==1.7.0",
]
langchain = [
    "langchain==1.4.9",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.4",
    "langchain-openrouter==0.2.9",
]
langchain-aws = [
    "langchain==1.4.9",
    "langchain-aws==1.9.1",
]
notebook = [
    "kedi-notebook>=0.1,<0.2",
]
playground = [
    "basedpyright>=1.40.2,<1.41",
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54,<0.55",
]
snapshots = [
    "cloudpickle==3.1.2",
]
terminal-bench = [
    "codex-auth-helper==1.13.0; python_version >= '3.12'",
    "harbor[daytona]==0.25.0; python_version >= '3.12'",
]
typesafe = [
    "kedi-typesafe>=0.3.3,<0.4",
]
a2a = [
    "a2a-sdk[http-server]==1.3.0",
    "uvicorn==0.54.0",
]
a2a-persistence = [
    "a2a-sdk[http-server,sqlite]==1.3.0",
    "filelock==4.2.9",
    "uvicorn==0.54.0",
]

[tool.hatch.build]
include-package-data = true

[tool.hatch.version]
path = "src/kedi/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kedi",
    "/src/kedi/modules/*.kedi",
    "/README.md",
    "/LICENSE",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/kedi",
]

[tool.uv]
conflicts = [
    [
        { extra = "terminal-bench" },
        { group = "dev" },
    ],
    [
        { extra = "terminal-bench" },
        { extra = "codex-model" },
    ],
    [
        { extra = "codex-model" },
        { group = "dev" },
    ],
    [
        { extra = "codex-model" },
        { extra = "typesafe" },
    ],
    [
        { extra = "terminal-bench" },
        { extra = "typesafe" },
    ],
]

[tool.uv.sources]
tree-sitter-kedi = { path = "tree-sitter-kedi", editable = true }
kedi-notebook = { path = "notebook", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff 0.17 also formats Python blocks in Markdown; documentation keeps its own layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set; keep the rules this project was linted with.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
extra-paths = ["notebook/src"]

[tool.ty.rules]
# basedpyright narrows Literal values less than ty and still needs these casts.
redundant-cast = "ignore"

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["src/kedi"]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]

[tool.coverage.report]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\s*\\.\\.\\.\\s*(#.*)?$",
]

[dependency-groups]
dev = [
    "a2a-sdk[http-server,sqlite]==1.3.0",
    "anthropic==2.6.0",
    "basedpyright==1.40.2",
    "cassetter[httpx]==0.17.0",
    "claude-agent-sdk==0.2.178",
    "codex-auth-helper[websocket]==1.13.0",
    "coverage==7.17.2",
    "dspy==3.4.1",
    "groq==1.7.0",
    "kedi-decisions==0.1.3",
    "kedi-laya[pydantic,langchain]==0.1.1",
    "langchain==1.4.9",
    "langchain-aws==1.9.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.4",
    "langchain-openrouter==0.2.9",
    "kedi-typesafe[all]==0.3.3",
    "pre-commit==4.7.0",
    "pydantic-ai==2.66.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "ty==0.0.98",
    "uvicorn==0.54.0",
]
