[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[project]
name = "kedi"
version = "0.3.0"
description = "Kedi Language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dspy",
    "click",
    "pytest>=8.2",
    "pydantic>=2",
    "python-dotenv",
    "pydantic-settings",
    "pydantic-ai>=1.0.17",
    "tree-sitter>=0.25",
    "tree-sitter-kedi==0.1.0",
    "tree-sitter-python>=0.23",
    "pygls>=1.3",
]
authors = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
maintainers = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
license = {text = "Apache-2.0"}
keywords = ["kedi", "llm", "orchestration", "dsl", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://docs.kedi-lang.org/"
Source = "https://github.com/kedi-lang/kedi"
Tracker = "https://github.com/kedi-lang/kedi/issues"

[project.scripts]
kedi = "kedi.cli:main"
kedi-lsp = "kedi.lsp.server:main"

[tool.hatch.build]
packages = ["src/kedi"]
include-package-data = true

[tool.uv.sources]
tree-sitter-kedi = { git = "https://github.com/kedi-lang/tree-sitter-kedi", rev = "e8e0331b27b47b4ba63646c09e2bd786e2f3e87f" }

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
