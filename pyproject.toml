[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi"
dynamic = ["version"]
description = "Kedi Language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "dspy",
    "click",
    "pytest>=8.2",
    "pydantic>=2",
    "docstring-parser>=0.18",
    "python-dotenv",
    "pydantic-settings",
    "pydantic-ai>=1.0.17",
    "tree-sitter>=0.25",
    "tree-sitter-kedi==0.4.0",
    "tree-sitter-python>=0.23",
    "pygls>=1.3",
    "rich>=13",
    "langchain",
    "langchain-openai",
    "langchain-openrouter",
    "langchain-mcp-adapters",
    "basedpyright>=1.39.6",
    "nodejs-wheel>=24.16.0",
]
authors = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
maintainers = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"}
]
license = {text = "Apache-2.0"}
keywords = ["kedi", "llm", "orchestration", "dsl", "workflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://docs.kedi-lang.org/"
Source = "https://github.com/kedi-lang/kedi"
Tracker = "https://github.com/kedi-lang/kedi/issues"

[project.scripts]
kedi = "kedi.__main__:main"
kedi-lsp = "kedi.lsp.server:main"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk",
]
playground = [
    "basedpyright>=1.39.6",
    "fastapi>=0.138.1",
    "pydantic-monty>=0.0.18",
    "uvicorn>=0.30",
]

[tool.hatch.build]
include-package-data = true

[tool.hatch.version]
path = "src/kedi/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kedi",
    "/src/kedi/modules/*.kedi",
    "/README.md",
    "/LICENSE",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/kedi",
]

[tool.uv.sources]
tree-sitter-kedi = { path = "tree-sitter-kedi", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["src/kedi"]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]

[tool.coverage.report]
omit = [
    "tree-sitter-kedi/**",
    "tests/**",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\s*\\.\\.\\.\\s*(#.*)?$",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "cassetter[httpx]==0.5.0",
    "coverage>=7.14.1",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
